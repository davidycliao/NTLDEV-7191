# .tiny[Why Text?]
---
name: overview

&amp;nbsp;

.huge.hi-grey[Most political activity leaves a **textual/digital trace**.]


- Parliamentary speeches, hearing transcripts, party manifestos


- Court rulings, bills, administrative records, diplomatic cables


- News coverage, social media posts, politicians' tweets


- Open-ended survey responses, interview transcripts


.hi-grey[**Then:**] human reading and hand coding (e.g., the Manifesto Project)


.hi-grey[**Now:**] .hi-turquoise[**scale**] — millions of documents can be analyzed systematically




---
layout: true
# .tiny[What Is "Text as Data"?]
---

&amp;nbsp;

.huge.hi-grey[Treat text as **data**: turn unstructured language/data into analyzable quantitative information to answer social-science questions.]

.grey-mid[**Quantitative text analysis** and **NLP** are the toolkit; the social-science question is the job.]

--

&amp;nbsp;

.center[.hi-slate[**corpus**] .grey-mid[→] .hi-slate[**representation**] .grey-mid[→] .hi-slate[**model**] .grey-mid[→] .hi-slate[**validation**] .grey-mid[→] .hi-slate[**inference**]]


&amp;nbsp;

- **Representation**: bag of words, word embeddings, language models


- **Model**: dictionaries, classifiers, topic models, scaling


- **Validation**: comparison with hand coding, expert judgment, external criteria

# .tiny[Roadmap: Two Tasks]
---

&amp;nbsp;

.huge.hi-grey[Text-as-data research does **two** different things.]

.pull-left[

.hi-grey[**Measurement**]

- How do we turn a concept into a credible text-based measure?
- Contribution: new **method**, new **measure**, new **dataset**
- Star of the show: the method itself

]

.pull-right[

.hi-grey[**Application**]

- What substantive question does the measure answer?
- Contribution: new **empirical finding**, theory test
- Star of the show: research design and identification

]

--

- The textbook (Grimmer, Roberts &amp; Stewart 2022) has three tasks: **discovery**, **measurement**, **inference**.
- Here we collapse them: .hi-turquoise[measurement] ≈ discovery + measurement; .hi-purple[application] ≈ inference.

# .tiny[Example 2: Open-Ended Answers as Causal Graphs]
---

.pull-left[

.hi-grey[**Jankin, Liao &amp; Tang (2026)**]

*Folk Theories of Partisan Conflict*

- **Question**: does it matter *why* a partisan thinks the country split — over and above **how much** they dislike the other side?
- **Data**: 1,200 US adults, quota-matched; several open-ended items (the graphs here code Q7)

]

.pull-right[

.hi-grey[**The prompt**]

.hi-slate[*"Which factors, events, groups, or institutions do you think caused Democrats and Republicans to view each other more negatively than they did 50 years ago? Please explain what caused what, who or what you think was responsible, and what effects followed."*]

]


.hi-turquoise[**The measurement move:**] code each free-text answer as a .hi-purple[**directed acyclic graph**] — nodes are the factors the respondent names (15 factors, 3 domains), edges are the causal links they draw between them.

---

&lt;img src="course-figures/folk-theory-dags.png" alt="" width="56%" style="display: block; margin: auto;" /&gt;

.center[.grey-mid[Jankin, Liao &amp; Tang (2026), Fig. 4: popular folk theories of the divide, grouped by root cause (% = within-party share)]]


- **Same factors, opposite arrows** — only the direction tells the theories apart; the graph gives each person's .hi-purple[**root cause**].


- .hi-red[**Validated:**] coders agree on which factors each answer names (**κ = 0.84**); an LLM with the same codebook matches them (**F1 = 0.92**). .hi-turquoise[**Role of text:**] the theory you hold predicts tolerance of anti-democratic action, net of affect and ideology.

# .tiny[Using Generative AI]
---

.hi-grey[This course follows NTU's **Guidelines for the Use of Generative AI and Research Integrity**. AI is a support tool: it does not replace your judgment or your responsibility for what you submit.]

.hi-turquoise[**1. Permitted uses in your assignments**] — conceptualisation; initial literature screening, for human verification; supporting writing and editing; audiovisual and interactive components. The argument and the analysis stay your own.

.hi-purple[**2. Disclose AI use in every submission**] — every assignment, lab report, poster, final paper, and bonus submission. State which tool and version, what you asked it to do, how you used the output, and how you checked it. No AI used? Write: .grey-mid["No generative AI tools were used in the preparation of this assignment."]

.hi-red[**3. No declaration, no acceptance.**] An assignment without a declaration is not accepted until a complete one is provided. Misrepresenting AI use, failing to verify AI output, fabricating sources or data through AI, or using AI to bypass a learning goal may be treated as academic misconduct.
